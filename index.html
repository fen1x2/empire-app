<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Империя Друзей 2.0</title>
<script src="https://telegram.org"></script>
<style>
body{background:#0f172a;color:#f8fafc;font-family:sans-serif;margin:0;padding:0 0 75px;user-select:none}
.top{display:flex;justify-content:space-between;padding:15px;background:#1e293b;border-bottom:1px solid #334155;font-weight:bold}
.bal{color:#f59e0b}
.tab{display:none;padding:15px}.tab.on{display:block}
.box{position:relative;height:200px;background:#020617;border-radius:12px;border:1px solid #334155;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#x{position:relative;z-index:2;font-size:44px;font-weight:900}
.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid #334155}
.row{display:flex;gap:8px;margin-bottom:10px}
input{width:50%;padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:16px;text-align:center}
button{border:none;border-radius:8px;padding:12px;font-weight:bold;font-size:15px;color:#fff;cursor:pointer;width:100%}
.g{background:#10b981}.y{background:#f59e0b;color:#000}.r{background:#ef4444}.b{background:#3b82f6}
.item{display:flex;justify-content:space-between;align-items:center}
.nav{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;display:flex;border-top:1px solid #334155}
.nav button{background:none;color:#94a3b8;font-size:12px;padding:10px 0;border-radius:0}
.nav button.on{color:#f59e0b}
</style>
</head>
<body>
<div class="top"><div>👑 Империя 2.0</div><div class="bal">🪙 <span id="b">1000</span></div></div>

<div id="t1" class="tab on">
<div class="box"><canvas id="c"></canvas><div id="x">1.00x</div></div>
<div class="card">
<div class="row"><input id="bet" type="number" value="100"><button class="b" style="width:50%" onclick="dbl()">x2 Ставка</button></div>
<button id="btn" class="g" onclick="run()">🚀 ПОЛЕТЕЛИ</button>
</div>
</div>

<div id="t2" class="tab">
<div class="card">Доход с биржи: <b style="color:#10b981">+<span id="inc">0</span>/сек</b></div>
<div id="m"></div>
</div>

<div id="t3" class="tab"><div id="z"></div></div>

<div id="t4" class="tab">
<div class="card item"><div><b>💰 +10,000 монет</b><br><small>На баланс</small></div><button class="y" style="width:90px" onclick="pay('coins_10k',50)">50 ⭐</button></div>
<div class="card item"><div><b>👑 VIP x2 доход</b><br><small>Навсегда</small></div><button class="y" style="width:90px" onclick="pay('vip_status',150)">150 ⭐</button></div>
<div class="card item"><div><b>🚀 Страховка</b><br><small>5 игр</small></div><button class="y" style="width:90px" onclick="pay('rocket_shield',75)">75 ⭐</button></div>
</div>

<div class="nav">
<button class="on" onclick="sw(1,this)">🚀 Краш</button>
<button onclick="sw(2,this)">📈 Биржа</button>
<button onclick="sw(3,this)">🎯 Задания</button>
<button onclick="sw(4,this)">⭐ Магазин</button>
</div>

<script>
let bal=1000,inc=0,vip=false,fly=false,m=1,cp=1,cb=0,tm;
const pl=[{n:"Новичок",p:250,r:2,o:0},{n:"Трейдер",p:1200,r:12,o:0},{n:"Кит",p:5000,r:60,o:0}];
const z=[{n:"Канал Новостей",r:500,u:"https://t.me",d:false},{n:"Чат Игроков",r:750,u:"https://t.me",d:false}];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");

function upd(){document.getElementById("b").innerText=Math.floor(bal);document.getElementById("inc").innerText=inc*(vip?2:1);}
setInterval(()=>{if(inc>0){bal+=inc*(vip?2:1);upd();}},1000);

function sw(n,el){
document.querySelectorAll(".tab").forEach(e=>e.classList.remove("on"));
document.querySelectorAll(".nav button").forEach(e=>e.classList.remove("on"));
document.getElementById("t"+n).classList.add("on");el.classList.add("on");
if(n===2)document.getElementById("m").innerHTML=pl.map((p,i)=>`<div class="card item"><div><b>${p.n} (Ур.${p.o})</b><br><small>+${p.r}/сек | ${p.p} 🪙</small></div><button class="g" style="width:90px" onclick="buyP(${i})">Купить</button></div>`).join("");
if(n===3)document.getElementById("z").innerHTML=z.map((t,i)=>`<div class="card item"><div><b>${t.n}</b><br><small>+${t.r} 🪙</small></div><button class="b" style="width:90px" ${t.d?"disabled":""} onclick="doZ(${i})">${t.d?"Готово":"Жми"}</button></div>`).join("");
}

function dbl(){let i=document.getElementById("bet");i.value=Math.min(Math.floor(bal),(parseInt(i.value)||10)*2);}

function run(){
let btn=document.getElementById("btn"),xd=document.getElementById("x");
if(!fly){
cb=parseInt(document.getElementById("bet").value);
if(!cb||cb<10||cb>bal)return alert("Мало монет!");
bal-=cb;upd();fly=true;m=1;
cp=Math.random()<0.15?1.08:1.2+Math.random()*4;
xd.style.color="#fff";btn.className="y";btn.innerText="ЗАБРАТЬ "+cb;
tm=setInterval(()=>{
m+=0.03;xd.innerText=m.toFixed(2)+"x";btn.innerText="ЗАБРАТЬ "+Math.floor(cb*m);
cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;ctx.clearRect(0,0,cv.width,cv.height);
let p=Math.min((m-1)/4,1),px=30+p*(cv.width-70),py=cv.height-30-p*(cv.height-70);
ctx.strokeStyle="#f59e0b";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,cv.height-20);ctx.lineTo(px,py);ctx.stroke();
ctx.font="30px Arial";ctx.fillText("🚀",px-15,py+10);
if(m>=cp){clearInterval(tm);fly=false;xd.innerText="💥 "+cp.toFixed(2)+"x";xd.style.color="#ef4444";btn.className="r";btn.innerText="ВЗРЫВ! Еще раз";}
},50);
}else{
clearInterval(tm);fly=false;let w=Math.floor(cb*m);bal+=w;upd();
xd.style.color="#10b981";btn.className="g";btn.innerText="ПОБЕДА +"+w+" (Еще)";
}
}

function buyP(i){if(bal>=pl[i].p){bal-=pl[i].p;pl[i].o++;inc+=pl[i].r;pl[i].p=Math.floor(pl[i].p*1.35);upd();sw(2,document.querySelectorAll(".nav button")[1]);}}
function doZ(i){window.open(z[i].u);setTimeout(()=>{if(!z[i].d){z[i].d=true;bal+=z[i].r;upd();sw(3,document.querySelectorAll(".nav button")[2]);}},2000);}
const inv={coins_10k:"https://t.me/$iYwwFOEYOegHAAAANLuQ_8DT3CM",vip_status:"https://t.me/$R8m9ROEYOEgoHAAAWmJE88L16ww",rocket_shield:"https://t.me/$Xwt90EEYOEgpHAAAznYSv8LXk_k"};
function pay(it,s){
  if(window.Telegram?.WebApp?.openInvoice && inv[it]){
    window.Telegram.WebApp.openInvoice(inv[it], function(st){
      if(st==="paid"){
        if(it==="coins_10k"){bal+=10000;upd();alert("✅ +10,000 монет зачислено!");}
        if(it==="vip_status"){vip=true;upd();alert("👑 VIP-Статус активирован!");}
        if(it==="rocket_shield"){alert("🚀 Страховка на 5 игр активирована!");}
      }
    });
  } else { alert("Откройте игру внутри Telegram!"); }
}
</script>
</body>
</html>
